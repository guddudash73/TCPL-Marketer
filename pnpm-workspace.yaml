packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  '@prisma/config@7.10.0>deepmerge-ts': 8.0.2
  'prisma@7.10.0>mysql2': 3.24.4
audit:
  level: moderate
  # Dev-only eslint-config-next dependency; GHSA-vfj7-8cjw-p6xm has no fix.
  # Re-evaluate automatically when the dependency graph changes.
  ignore:
    - GHSA-vfj7-8cjw-p6xm
  ignorePrune: true
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  unrs-resolver: false
