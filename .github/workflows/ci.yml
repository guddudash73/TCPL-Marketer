name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/tcpl_marketer
      DIRECT_URL: postgresql://app:app@localhost:5432/tcpl_marketer
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: tcpl_marketer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d tcpl_marketer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply CI database migrations
        run: pnpm --filter @tcpl-marketer/database exec prisma migrate deploy

      - name: Seed CI business configuration
        run: pnpm --filter @tcpl-marketer/database seed:configuration

      - name: Test
        run: pnpm test

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Build
        run: pnpm build
